<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 47 44" width="47" height="44" role="img" aria-label="Clawd, the Claude Code mascot">
  <title>Clawd</title>

  <ellipse cx="23.8" cy="40.5" rx="18" ry="2.4" fill="#000000" opacity="0.12">
    <animate attributeName="rx" values="18;14;18" dur="1.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.06;0.12" dur="1.1s" repeatCount="indefinite" />
  </ellipse>

  <g fill="#D97757">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="1.1s" repeatCount="indefinite" />

    <!-- row 0 -->
    <rect x="5.082" y="0.938" width="4.292" height="9.138"/>
    <rect x="9.233" y="0.938" width="4.292" height="9.138"/>
    <rect x="13.384" y="0.938" width="4.292" height="9.138"/>
    <rect x="17.535" y="0.938" width="4.292" height="9.138"/>
    <rect x="21.686" y="0.938" width="4.292" height="9.138"/>
    <rect x="25.838" y="0.938" width="4.292" height="9.138"/>
    <rect x="29.989" y="0.938" width="4.292" height="9.138"/>
    <rect x="34.140" y="0.938" width="4.292" height="9.138"/>
    <rect x="38.291" y="0.938" width="4.292" height="9.138"/>

    <!-- row 1 -->
    <rect x="0.931" y="9.938" width="4.292" height="9.138"/>
    <rect x="5.082" y="9.938" width="4.292" height="9.138"/>
    <rect x="13.384" y="9.938" width="4.292" height="9.138"/>
    <rect x="17.535" y="9.938" width="4.292" height="9.138"/>
    <rect x="21.686" y="9.938" width="4.292" height="9.138"/>
    <rect x="25.838" y="9.938" width="4.292" height="9.138"/>
    <rect x="29.989" y="9.938" width="4.292" height="9.138"/>
    <rect x="38.291" y="9.938" width="4.292" height="9.138"/>
    <rect x="42.442" y="9.938" width="4.292" height="9.138"/>

    <!-- row 1: eye lower halves (always filled) -->
    <rect x="9.233" y="14.507" width="4.292" height="4.569"/>
    <rect x="34.140" y="14.507" width="4.292" height="4.569"/>

    <!-- row 2 -->
    <rect x="5.082" y="18.939" width="4.292" height="9.138"/>
    <rect x="9.233" y="18.939" width="4.292" height="9.138"/>
    <rect x="13.384" y="18.939" width="4.292" height="9.138"/>
    <rect x="17.535" y="18.939" width="4.292" height="9.138"/>
    <rect x="21.686" y="18.939" width="4.292" height="9.138"/>
    <rect x="25.838" y="18.939" width="4.292" height="9.138"/>
    <rect x="29.989" y="18.939" width="4.292" height="9.138"/>
    <rect x="34.140" y="18.939" width="4.292" height="9.138"/>
    <rect x="38.291" y="18.939" width="4.292" height="9.138"/>

    <!-- row 3: feet -->
    <rect x="5.082" y="27.939" width="4.292" height="9.138"/>
    <rect x="13.384" y="27.939" width="4.292" height="9.138"/>
    <rect x="29.989" y="27.939" width="4.292" height="9.138"/>
    <rect x="38.291" y="27.939" width="4.292" height="9.138"/>

    <!-- row 1: eye upper halves (blink overlay, closed = filled) -->
