      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="3.4s" repeatCount="indefinite" />
    </rect>
    <rect x="34.140" y="9.938" width="4.292" height="4.569" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="3.4s" repeatCount="indefinite" />
    </rect>
