<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 56" width="90" height="46" role="img" aria-label="Clawd, the Claude Code mascot, waving hello">
  <title>Clawd</title>

  <ellipse cx="55" cy="49" rx="26" ry="5" fill="#000000" opacity="0.12">
    <animate attributeName="rx" values="26;20;26" dur="1.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.06;0.12" dur="1.1s" repeatCount="indefinite" />
  </ellipse>

  <g fill="#D97757">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.1s" repeatCount="indefinite" />

    <!-- row 0 -->
    <rect x="10" y="0" width="10" height="10" /><rect x="20" y="0" width="10" height="10" />
    <rect x="30" y="0" width="10" height="10" /><rect x="40" y="0" width="10" height="10" />
    <rect x="50" y="0" width="10" height="10" /><rect x="60" y="0" width="10" height="10" />
    <rect x="70" y="0" width="10" height="10" /><rect x="80" y="0" width="10" height="10" />
    <rect x="90" y="0" width="10" height="10" />

    <!-- row 1 (cols 2 and 8 left open as eyes) -->
    <rect x="0"  y="10" width="10" height="10" /><rect x="10" y="10" width="10" height="10" />
    <rect x="30" y="10" width="10" height="10" /><rect x="40" y="10" width="10" height="10" />
    <rect x="50" y="10" width="10" height="10" /><rect x="60" y="10" width="10" height="10" />
    <rect x="70" y="10" width="10" height="10" />
    <rect x="90" y="10" width="10" height="10" /><rect x="100" y="10" width="10" height="10" />

    <!-- row 2 -->
    <rect x="10" y="20" width="10" height="10" /><rect x="20" y="20" width="10" height="10" />
    <rect x="30" y="20" width="10" height="10" /><rect x="40" y="20" width="10" height="10" />
    <rect x="50" y="20" width="10" height="10" /><rect x="60" y="20" width="10" height="10" />
    <rect x="70" y="20" width="10" height="10" /><rect x="80" y="20" width="10" height="10" />
    <rect x="90" y="20" width="10" height="10" />

    <!-- row 3: feet -->
    <rect x="10" y="30" width="10" height="10" /><rect x="30" y="30" width="10" height="10" />
    <rect x="70" y="30" width="10" height="10" /><rect x="90" y="30" width="10" height="10" />

    <!-- eyes: filled briefly to blink -->
    <rect x="20" y="10" width="10" height="10">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="3.4s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="10" width="10" height="10">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="3.4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
